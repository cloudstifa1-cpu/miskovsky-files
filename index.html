<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miskovsky Files</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 40px;
    background: #0b0b12;
    color: #ffffff;
    font-family: Georgia, "Times New Roman", serif;
  }
  h1 {
    text-align: center;
    font-size: 2rem;
    margin: 8px 0 4px;
    color: #ffffff;
  }
  p.sub {
    text-align: center;
    margin: 0 0 24px;
    font-size: 1.1rem;
    color: #ffd966;
  }
  .grid {
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.stage {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 16px;
    min-height: 64px;
    background: #1c1c2e;
    border: 2px solid #ffd966;
    border-radius: 12px;
    color: #ffffff;
    text-decoration: none;
    font-size: 1.3rem;
    font-weight: bold;
  }
  a.stage:active, a.stage:focus {
    background: #ffd966;
    color: #000000;
  }
  .num {
    flex: 0 0 38px;
    height: 38px;
    border-radius: 50%;
    background: #ffd966;
    color: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .note {
    max-width: 560px;
    margin: 24px auto 0;
    text-align: center;
    font-size: 1rem;
    color: #ffffff;
  }
</style>
</head>
<body>
  <h1>Miskovsky Files</h1>
  <p class="sub">Tap a stage to open its document</p>

  <div class="grid" id="grid"></div>

  <p class="note">Documents open in Google Docs. Sign in as cloudstifa1@gmail.com.</p>

<script>
  // To add or change a button, edit this list. Order here = order on the page.
  var stages = [
    ["Family History",   "1JMKsRR6x_V1wu6aFAvYGPikMNpNq3hvDONlnlVwZQsI"],
    ["Father",           "1Arld_kfzFUaZfPJwMikmgOZ_HcI_ayaKEl3HKTo_uyo"],
    ["Early Years",      "1MkgdUuOzR64h9AWi8aMbhAXJMdK0zP_eT-dQoh9JP7o"],
    ["Middle School",    "1_gj0AVJJiYR3255FpFnZkDyou3xo8TaG5dq07fZZPMw"],
    ["High School",      "1b0xbx7g1nFxoDFykaIhThKwI__yY-PB7L8V67xI8NS0"],
    ["College",          "1NpXar1YZOeTPs61xQszqFDO4EgraewjcBExRJFOd-z8"],
    ["Military",         "1U1SUMBxhjzRsiBVADh1Vkb8Pvpk6L2FdSypQk17cWis"],
    ["Law Practice",     "1EJhi454OwbmOvkNOzSTCEJVrb1UKIdqSvhoILaov8Ow"],
    ["Music Business",   "1YETi_AWTcSxfzAiZZmvlvxMucOAL_1WeGLf2rxj4NhY"],
    ["Pig for President","1a1s9H7ANZO-QVK1ylGM_TChjqW8Y-YXNfvMUlVSPsrI"],
    ["Statue of Liberty","1ekrcTZ8BUOZRN8t-1S6oqHMbW5toeXroWTOSdBMnXLQ"]
  ];

  var grid = document.getElementById("grid");
  stages.forEach(function (s, i) {
    var a = document.createElement("a");
    a.className = "stage";
    // Opens in the Google Docs app; if the app isn't there, falls back to the browser
    var path = "docs.google.com/document/d/" + s[1] + "/edit";
    a.href = "intent://" + path +
      "#Intent;scheme=https;package=com.google.android.apps.docs.editors.docs;" +
      "S.browser_fallback_url=" + encodeURIComponent("https://" + path) + ";end";
    var n = document.createElement("span");
    n.className = "num";
    n.textContent = i + 1;
    var t = document.createElement("span");
    t.textContent = s[0];
    a.appendChild(n);
    a.appendChild(t);
    grid.appendChild(a);
  });
</script>
</body>
</html>
